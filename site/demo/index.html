<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledger — Team billing</title>
    <!--
      A small, realistic page for FrameWatch's own demos. Three things are
      deliberately wrong, and the landing page shows FrameWatch finding them:
        - the primary button's text fails WCAG AA contrast (white on #4f8ef7)
        - the "Cancel" button sits 3px lower than "Save changes"
        - the plan name is 13px on a page whose body text is 14px
    -->
    <style>
      :root { --ink: #1c1f26; --muted: #6b7280; --line: #e5e7eb; --accent: #4f8ef7; --ok: #16a34a; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: #f7f8fa; }
      header { display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 32px; background: #fff; border-bottom: 1px solid var(--line); }
      header b { font-size: 16px; }
      header a { color: var(--muted); text-decoration: none; }
      header a[aria-current] { color: var(--ink); font-weight: 600; }
      main { max-width: 720px; margin: 32px auto; padding: 0 24px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .lede { color: var(--muted); margin: 0 0 24px; }
      .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 24px; margin-bottom: 16px; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
      .plan { font-size: 13px; color: var(--muted); }
      .price { font-size: 28px; font-weight: 600; }
      .price small { font-size: 14px; font-weight: 400; color: var(--muted); }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #dcfce7; color: var(--ok); font-size: 12px; font-weight: 600; }
      label { display: block; font-weight: 600; margin: 16px 0 6px; }
      input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
      .actions { display: flex; gap: 12px; margin-top: 24px; align-items: flex-start; }
      button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
      #save { background: var(--accent); color: #fff; }
      #cancel { background: #fff; border-color: var(--line); color: var(--ink); margin-top: 3px; }
      .seats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .seat { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
      .seat b { display: block; }
      .seat span { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <b>Ledger</b>
      <a href="#">Overview</a>
      <a href="#" aria-current="page">Billing</a>
      <a href="#">Members</a>
      <a href="#">Settings</a>
    </header>
    <main>
      <h1>Team billing</h1>
      <p class="lede">Your plan, your seats, and the card we charge.</p>

      <section class="card">
        <div class="row">
          <div>
            <div class="plan">Current plan</div>
            <div class="price">$48 <small>/ month</small></div>
          </div>
          <span class="badge">Active</span>
        </div>
      </section>

      <section class="card">
        <div class="seats">
          <div class="seat"><b>3 of 5</b><span>seats in use</span></div>
          <div class="seat"><b>Sep 28</b><span>next invoice</span></div>
          <div class="seat"><b>Visa ·· 4242</b><span>payment method</span></div>
        </div>
      </section>

      <form class="card" id="billing">
        <label for="company">Company name on invoices</label>
        <input id="company" value="Keko Food LLC" />
        <label for="email">Billing email</label>
        <input id="email" type="email" value="finance@keko.dev" />
        <div class="actions">
          <button id="save" type="button">Save changes</button>
          <button id="cancel" type="button">Cancel</button>
        </div>
      </form>
    </main>
  </body>
</html>
