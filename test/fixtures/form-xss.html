<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FrameWatch Unescaped Echo Fixture</title>
    <style>
      html { background: #ffffff; }
      body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #111111; }
      form { width: 480px; padding: 24px; }
      input { display: block; box-sizing: border-box; width: 400px; margin: 0 0 12px; padding: 6px 8px; border: 1px solid #999999; font: inherit; }
      button { height: 36px; border: 0; background: #1e90ff; color: #ffffff; font: inherit; padding: 0 20px; }
      #out { margin: 16px 0 0; padding: 12px; min-height: 40px; border: 1px dashed #999999; }
    </style>
  </head>
  <body>
    <form id="echo-form">
      <label for="q">Your message</label>
      <input id="q" name="q" type="text" />
      <button id="echo-submit" type="submit">Send</button>
      <div id="out"></div>
    </form>

    <script>
      // The bug on purpose: user input written back as markup. A payload that
      // runs here is a real reflected XSS, and framewatch_form_test has to say so.
      document.getElementById("echo-form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("out").innerHTML = "You said: " + document.getElementById("q").value;
      });
    </script>
  </body>
</html>
