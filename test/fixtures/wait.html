<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FrameWatch Wait Fixture</title>
    <!--
      What a "wait until" has to notice, one thing per query parameter:
        ?image=N      an <img> whose bytes arrive N ms after the page loaded
        ?animate=N    a CSS animation that runs N ms and then stops
        ?pending=1    an <img> that never finishes loading
        ?late=N       an element with id "late" added N ms after load
    -->
    <style>
      body { margin: 0; padding: 20px; font: 14px system-ui; }
      #box { width: 100px; height: 100px; background: #3b82f6; }
      .spin { animation: turn var(--ms) linear 1; }
      @keyframes turn { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <h1>Waiting</h1>
    <div id="box"></div>
    <div id="images"></div>
    <script>
      var q = new URLSearchParams(location.search);
      // Images go in after the load event, the way a lazy or client-rendered
      // image does — otherwise the browser's own load waits for them and there
      // is nothing left for an images wait to notice.
      window.addEventListener("load", function () {
        setTimeout(function () {
          var image = Number(q.get("image"));
          if (image > 0) {
            var img = document.createElement("img");
            img.id = "late-image";
            img.src = "/api/image?w=200&h=100&delay=" + image;
            document.getElementById("images").appendChild(img);
          }
          if (q.get("pending") === "1") {
            var never = document.createElement("img");
            never.id = "never";
            never.src = "/api/pending";
            document.getElementById("images").appendChild(never);
          }
        }, 0);
      });
      var animate = Number(q.get("animate"));
      if (animate > 0) {
        var box = document.getElementById("box");
        box.style.setProperty("--ms", animate + "ms");
        box.className = "spin";
      }
      var late = Number(q.get("late"));
      if (late > 0) {
        setTimeout(function () {
          var el = document.createElement("p");
          el.id = "late";
          el.textContent = "Here now";
          document.body.appendChild(el);
        }, late);
      }
    </script>
  </body>
</html>
