<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FrameWatch Snapshot Fixture</title>
    <style>
      body { margin: 0; padding: 20px; font: 14px system-ui, sans-serif; }
      .card { cursor: pointer; padding: 8px; }
      #hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>Sign in</h1>
    <form id="login">
      <label>Email <input id="email" type="email" /></label>
      <label>Password <input id="password" type="password" /></label>
      <label><input id="remember" type="checkbox" checked /> Remember me</label>
      <button id="submit" type="button">Sign in</button>
    </form>
    <nav id="nav">
      <a href="/pricing">Pricing</a>
      <a href="/docs">Docs</a>
    </nav>
    <div id="card" class="card">Card</div>
    <p id="blurb">Some text about the product.</p>
    <p id="hidden">Not shown</p>
    <div id="result" aria-live="polite"></div>
    <script>
      document.getElementById("submit").addEventListener("click", () => {
        document.getElementById("result").textContent = "Signed in";
        const done = document.createElement("button");
        done.id = "done";
        done.textContent = "Continue";
        document.getElementById("result").appendChild(done);
      });
    </script>
  </body>
</html>
