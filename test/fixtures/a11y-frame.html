    <meta charset="utf-8" />
    <title>Accessible host with an inaccessible frame</title>

  </head>
  <body>
    <main>
      <h1>Embedded widget</h1>
      <iframe src="a11y-bad.html" title="Embedded widget" width="400" height="200"></iframe>
    </main>
  </body>
</html>
