<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FrameWatch Recorder Flip Fixture</title>
    <style>
      html, body { margin: 0; padding: 0; background: #ffffff; }
    </style>
  </head>
  <body>
    <script>
      // Whole page turns black after 500ms — used to verify the recorder sees change over time.
      setTimeout(() => {
        document.documentElement.style.background = "#000000";
      }, 500);
    </script>
  </body>
</html>
