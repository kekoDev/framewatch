<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FrameWatch Interact Context Fixture</title>
    <style>
      /* Everything is in normal flow on purpose: inserting the banner has to
         push the rest of the page down, which is what makes it a layout shift. */
      html, body { margin: 0; background: #ffffff; font: 13px monospace; }
      #go { display: block; margin: 20px; width: 120px; height: 40px; background: #1e90ff; border: 0; }
      #quiet { margin: 0 20px; width: 120px; height: 40px; background: #cccccc; }
      #quiet.on { background: #800080; }
      #app { margin: 20px; width: 300px; height: 100px; background: #eeeeee; }
      .added { width: 200px; height: 60px; background: #8b0000; }
      #banner { width: 100%; height: 80px; background: #ff8c00; }
    </style>
  </head>
  <body>
    <button id="go">go</button>
    <div id="quiet"></div>
    <div id="app"></div>
    <p id="copy">copy that the banner pushes down the page</p>
    <script>
      // Said once, while the page loads: it belongs to the "before" card, not
      // to whatever the next interaction does.
      console.log("fixture loaded");

      document.getElementById("go").addEventListener("click", () => {
        console.log("go clicked");
        console.error("go exploded");
        fetch("/api/ok");
        const added = document.createElement("div");
        added.className = "added";
        document.getElementById("app").appendChild(added);
        // Inserted above everything in the flow: shoves the whole page down.
        const banner = document.createElement("div");
        banner.id = "banner";
        document.body.insertBefore(banner, document.body.firstChild);
      });

      // Changes colour and says nothing at all.
      document.getElementById("quiet").addEventListener("mouseenter", (event) => {
        event.target.classList.add("on");
      });
    </script>
  </body>
</html>
