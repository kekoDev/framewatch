<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FrameWatch Network Fixture</title>
    <style>html, body { margin: 0; background: #ffffff; }</style>
  </head>
  <body>
    <div id="box" style="width:200px;height:100px;background:#cccccc"></div>
    <script>
      const box = document.getElementById("box");
      // A request that succeeds, one that 404s, and one that never comes back —
      // the three outcomes the network layer has to tell apart.
      setTimeout(() => { fetch("/api/ok").then(() => { box.style.background = "#00a000"; }); }, 300);
      setTimeout(() => { fetch("/api/missing").then(() => { box.style.background = "#ff8c00"; }); }, 700);
      setTimeout(() => { fetch("/api/pending"); }, 1000);
    </script>
  </body>
</html>
